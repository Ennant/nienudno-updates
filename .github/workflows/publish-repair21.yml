name: Publish qualified repair 21
on:
  push:
    branches: [main]
    paths: [releases/9.7.0-complete.21.md]
permissions:
  contents: write
concurrency:
  group: publish-qualified-repair21
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 1
      - name: Restore and publish the exact qualified installer
        shell: bash
        run: |
          python3 - <<'PY'
          import gzip, hashlib, os, pathlib, re, subprocess, urllib.request
          repo = 'Ennant/nienudno-updates'
          assert os.environ['GITHUB_REPOSITORY'] == repo
          revision = os.environ['GITHUB_SHA']
          assert re.fullmatch(r'[0-9a-f]{40}', revision)
          expected = '5E8567FC08C217CCB2D105F51E1EABC4289B775FC47B10495EC133AF83FBBBAE'
          archive_hash = 'CBF416918A9D9901E37C9665648521A58EF20444427E9AF3A1505364A28DD7EF'
          target = 'repair944plus/Napraw-aktualizacje.exe'
          def download(path, limit):
              url = 'https://raw.githubusercontent.com/' + repo + '/' + revision + '/' + path
              with urllib.request.urlopen(url, timeout=120) as response:
                  body = response.read(limit + 1)
              assert len(body) <= limit, 'Download exceeds qualified bound'
              return body
          pieces = []
          for index in range(12):
              piece = download('publication/repair21/parts/' + str(index).zfill(2), 4194304)
              if index < 11: assert len(piece) == 4194304
              pieces.append(piece)
          packed = b''.join(pieces)
          assert len(packed) == 46424223
          assert hashlib.sha256(packed).hexdigest().upper() == archive_hash
          binary = gzip.decompress(packed)
          assert len(binary) == 52077428
          assert hashlib.sha256(binary).hexdigest().upper() == expected
          path = pathlib.Path(target)
          assert path.is_file() and not path.is_symlink()
          if hashlib.sha256(path.read_bytes()).hexdigest().upper() == expected:
              print('Qualified installer already published: ' + expected)
          else:
              # The job never executes the installer or reads publisher keys.
              temporary = path.with_name(path.name + '.qualified21.tmp')
              assert not temporary.exists()
              temporary.write_bytes(binary)
              os.replace(temporary, path)
              def git(*args):
                  return subprocess.check_output(['git', *args], text=True).strip()
              git('config', 'user.name', 'github-actions[bot]')
              git('config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com')
              git('add', '--', target)
              assert git('diff', '--cached', '--name-only').splitlines() == [target]
              git('commit', '-m', 'Publish qualified complete.21 short-link installer')
              # Non-forced push refuses a concurrent change and preserves history.
              git('push', 'origin', 'HEAD:main')
              print('Published exact qualified installer: ' + expected + ' commit ' + git('rev-parse', 'HEAD'))
          PY

